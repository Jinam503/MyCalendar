name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project MyCalendar.xcodeproj \
            -scheme MyCalendar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/MyCalendar.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign -f -s - --entitlements Widget/MyCalendarWidget.entitlements \
            Payload/MyCalendar.app/PlugIns/MyCalendarWidget.appex
          codesign -f -s - --entitlements App/MyCalendar.entitlements \
            Payload/MyCalendar.app
          zip -qry MyCalendar.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MyCalendar-ipa
          path: MyCalendar.ipa
